[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "scp-wikidot-backup"
version = "0.1.0"
description = "Backup and archival tool for Wikidot-based SCP sites."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { text = "MIT" }

dependencies = [
    "wikidot==4.5.0",
    "typer>=0.16,<1",
    "rich>=15",
    "pydantic>=2.11,<3",
    "httpx>=0.28,<1",
    "tenacity>=9,<10",
    "beautifulsoup4>=4.13,<5",
]

[project.optional-dependencies]
dev = [
"pytest>=9",
"pytest-cov>=6,<8",
"ruff>=0.12,<1",
]

[project.scripts]
wikidot-backup = "wikidot_backup.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = [
"E",
"F",
"I",
"UP",
"B",
]
